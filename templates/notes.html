<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>View Notes</title>
<style>body{margin:0;background:#f6f6f6;font-family:Arial;color:#171717}.wrap{max-width:900px;margin:auto;padding:30px 20px}.head{display:flex;justify-content:space-between;align-items:center}.back{background:#111;color:#fff;text-decoration:none;padding:10px 16px;border-radius:10px}.note{background:#fff;border:1px solid #e5e5e5;border-radius:15px;padding:20px;margin:14px 0}.date,.conf{color:#777;font-size:12px}.text{white-space:pre-wrap;font-size:22px;line-height:1.6;margin:14px 0}.empty{background:#fff;padding:30px;border-radius:15px;color:#777}</style></head>
<body><div class="wrap"><div class="head"><h1>View Notes</h1><a class="back" href="/">← New Note</a></div>{% if notes %}{% for n in notes %}<div class="note"><div class="date">{{n.created_at}}</div><div class="text">{{n.text or "[No text detected]"}}</div><div class="conf">Average recognition confidence: {{n.confidence}}%</div></div>{% endfor %}{% else %}<div class="empty">No saved notes yet.</div>{% endif %}</div></body></html>
